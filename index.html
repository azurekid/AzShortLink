<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=/dashboard/login" />
  <title>AzShortLink</title>
  <link rel="icon" type="image/svg+xml" href="https://azurehacking.com/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --surface: rgba(13, 23, 41, 0.88);
      --surface-border: rgba(255, 255, 255, 0.12);
      --text: #e2e8f0;
      --muted: #93a4bc;
      --accent: #00d4ff;
      --accent-2: #7dd3fc;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(0, 212, 255, 0.22), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.25), transparent 32%),
        linear-gradient(135deg, #07111f 0%, #0a1a32 55%, #0d2442 100%);
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .card {
      width: min(760px, 100%);
      padding: 40px;
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent);
      font-family: "Share Tech Mono", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.82rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 4.6rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }
    p {
      max-width: 58ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin: 18px 0 0;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }
    .primary {
      color: #06121b;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 30px rgba(0, 212, 255, 0.25);
    }
    .secondary {
      color: var(--text);
      border: 1px solid var(--surface-border);
      background: rgba(255, 255, 255, 0.03);
    }
    a:hover { transform: translateY(-1px); }
    .hint {
      margin-top: 18px;
      font-size: 0.92rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="brand">AzShortLink</div>
      <h1>Secure short links and profile dashboards.</h1>
      <p>
        You are being redirected to the dashboard sign-in page. Use the admin profile to manage
        links, profiles, analytics, and audit history.
      </p>
      <div class="actions">
        <a class="primary" href="/dashboard/login">Go to sign in</a>
        <a class="secondary" href="/dashboard">Open dashboard</a>
      </div>
      <div class="hint">If the redirect does not start automatically, use the sign-in button above.</div>
    </section>
  </main>
</body>
</html>
